name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      maildev:
        image: maildev/maildev:latest
        ports:
          - 1026:1025
          - 1081:1080
        options: >-
          --health-cmd "nc -z localhost 1025"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      APP_URL: http://localhost:3000
      TEST_BASE_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1026
      SMTP_USER: dummy
      SMTP_PASS: dummy
      MAIL_FROM: noreply@example.com
      MAILDEV_WEB_PORT: 1081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Show running containers before test
        run: docker ps -a
      - name: Show postgres logs before test
        run: |
          docker logs $(docker ps -aqf "ancestor=postgres:15") || true
      # prisma db push だけでは seed は自動実行されないため、明示的にシードを実行する（Prisma v4.16未満）
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
        env:
          NODE_ENV: development
      - name: Show running containers after test
        run: docker ps -a
      - name: Show postgres logs after test
        run: |
          docker logs $(docker ps -aqf "ancestor=postgres:15") || true
      - name: Show all docker logs after test
        run: |
          for id in $(docker ps -aq); do
            echo "===== Logs for container $id ====="
            docker logs $id || true
          done
