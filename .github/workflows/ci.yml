name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      maildev:
        image: maildev/maildev:latest
        ports:
          - 1025:1025
          - 1080:1080
        options: >-
          --health-cmd "nc -z localhost 1025"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      APP_URL: http://localhost:3000
      NODE_ENV: development
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: dummy
      SMTP_PASS: dummy
      MAIL_FROM: noreply@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Show running containers before test
        run: docker ps -a
      - name: Show postgres logs before test
        run: |
          docker logs $(docker ps -aqf "ancestor=postgres:15") || true
      - run: npx prisma db push
      - run: npm run build
      - run: npm run start &
      - run: sleep 10
      - run: npm test
      - name: Show running containers after test
        run: docker ps -a
      - name: Show postgres logs after test
        run: |
          docker logs $(docker ps -aqf "ancestor=postgres:15") || true
