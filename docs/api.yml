activities_participants_list:
  url: /api/activities/[id]/participants
  method: GET
  description: 指定した活動の参加者一覧を取得
  request:
    headers:
      Cookie: next-auth.session-token=<token> (認証必須)
    params:
      id: number - 活動ID
  response:
    status: 200
    body:
      participants: array
        - userId: number - ユーザーID
          name: string - ユーザー名
          email: string - メールアドレス
          status: number - 参加ステータス（0: pending, 1: confirmed, 2: declined）
          joinedAt: string - 参加登録日時（ISO 8601）
  notes:
    - Next.js API Route で処理（app/api/activities/[id]/participants/route.ts）
    - 活動が存在しない場合は 404 を返す

activities_participants_add:
  url: /api/activities/[id]/participants
  method: POST
  description: 指定した活動に参加者を追加
  request:
    headers:
      Content-Type: application/json
      Cookie: next-auth.session-token=<token> (認証必須)
    params:
      id: number - 活動ID
    body:
      userId: number (required) - ユーザーID
      status: number (optional, default: 0) - 参加ステータス
  response:
    status: 201
    body:
      participant:
        userId: number
        status: number
        joinedAt: string
  notes:
    - Next.js API Route で処理（app/api/activities/[id]/participants/route.ts）
    - 重複追加時は 409 を返す
    - バリデーションエラー時は 400 を返す

activities_participants_update:
  url: /api/activities/[id]/participants/[userId]
  method: PUT
  description: 指定した活動の参加者ステータスを更新
  request:
    headers:
      Content-Type: application/json
      Cookie: next-auth.session-token=<token> (認証必須)
    params:
      id: number - 活動ID
      userId: number - ユーザーID
    body:
      status: number (required) - 参加ステータス
  response:
    status: 200
    body:
      participant:
        userId: number
        status: number
        updatedAt: string
  notes:
    - Next.js API Route で処理（app/api/activities/[id]/participants/[userId]/route.ts）
    - 参加者が存在しない場合は 404 を返す

activities_participants_remove:
  url: /api/activities/[id]/participants/[userId]
  method: DELETE
  description: 指定した活動から参加者を削除
  request:
    headers:
      Cookie: next-auth.session-token=<token> (認証必須)
    params:
      id: number - 活動ID
      userId: number - ユーザーID
  response:
    status: 200
    body:
      ok: boolean - 成功フラグ
  notes:
    - Next.js API Route で処理（app/api/activities/[id]/participants/[userId]/route.ts）
    - 参加者が存在しない場合でも 200 を返す


