openapi: 3.0.3
info:
  title: Group Member List API
  version: '1.0.0'
  description: |
    本APIは「メールリンク認証」＋「独自セッション管理（next-auth.session-token）」方式です。
    - 認証トークン名は `next-auth.session-token` ですが、next-authライブラリは使用していません。
    - セッションはDBで管理し、クッキーでやり取りします。
    - 認証必須APIは `Cookie: next-auth.session-token=<token>` を送信してください。
    - 認証フロー:
      1. /api/login でメールアドレスを送信 → 認証リンクがメール送信される
      2. リンククリックで /api/auth/verify → セッション発行・クッキー付与
      3. 以降はクッキーを送信して認証API利用
    ※「next-auth.session-token」は命名互換のみで、next-authライブラリの導入・依存はありません。
paths:
  /api/login:
    post:
      summary: ログイン（認証メール送信）
      description: ユーザーのメールアドレスを受け取り、認証メールを送信。リンク経由でセッション発行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: ユーザーのメールアドレス
              required:
                - email
      responses:
        '200':
          description: 認証メール送信成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: next-auth.session-token=<token>; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 成功フラグ
      tags:
        - Auth
  /api/logout:
    post:
      summary: ログアウト
      description: セッションを削除し、クッキーをクリア
      parameters:
        - in: header
          name: Cookie
          required: true
          schema:
            type: string
          description: next-auth.session-token=<token>
      responses:
        '200':
          description: ログアウト成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: next-auth.session-token=; Path=/; HttpOnly; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 成功フラグ
      tags:
        - Auth


  /api/users/{id}:
    get:
      summary: ユーザー取得
      description: 指定したユーザーを取得
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ユーザーID
        - in: header
          name: Cookie
          required: true
          schema:
            type: string
          description: next-auth.session-token=<token>
      responses:
        '200':
          description: ユーザー情報取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: パラメータ不正
        '404':
          description: ユーザーが存在しない
      tags:
        - Users
    put:
      summary: ユーザー更新
      description: 指定したユーザーを更新
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ユーザーID
        - in: header
          name: Cookie
          required: true
          schema:
            type: string
          description: next-auth.session-token=<token>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ユーザー名
                email:
                  type: string
                  description: メールアドレス
      responses:
        '200':
          description: ユーザー情報更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
