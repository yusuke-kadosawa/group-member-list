              /api/resend-email:
                post:
                  summary: 認証メール再送
                  description: 有効な認証トークンが存在する場合、有効期限を延長して再送信
                  requestBody:
                    required: true
                    content:
                      application/json:
                        schema:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                              description: 再送対象メールアドレス
                          required:
                            - email
                  responses:
                    '200':
                      description: 再送成功
                    '400':
                      description: トークンが存在しない、またはバリデーションエラー
                    '500':
                      description: サーバーエラー
                  tags:
                    - Auth
            /api/auth/verify:
              get:
                summary: メールリンク認証確定
                description: メールで送信された認証リンクからアクセスし、セッションを発行
                parameters:
                  - in: query
                    name: token
                    required: true
                    schema:
                      type: string
                    description: 認証トークン
                responses:
                  '302':
                    description: 認証成功時は /home へリダイレクトし、セッションクッキーを付与
                    headers:
                      Set-Cookie:
                        schema:
                          type: string
                        description: next-auth.session-token=<token>; Path=/; HttpOnly; SameSite=Lax
                      Location:
                        schema:
                          type: string
                        description: /home
                  '400':
                    description: トークン不正または期限切れ
                  '500':
                    description: サーバーエラー
                tags:
                  - Auth
          /api/users:
